# Minimal compose file so you can run Phase 1 locally.
# Phase 2 replaces this with the full setup (reverse proxy, networks, volumes on the VM).
services:
  database:
    build: ./database
    env_file: .env
    volumes:
      - db_data:/var/lib/postgresql/data

  backend:
    build: ./backend
    env_file: .env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@database:5432/${POSTGRES_DB}
    depends_on:
      - database
    ports:
      - "8000:8000"

  frontend:
    build: ./frontend
    env_file: .env
    depends_on:
      - backend
    ports:
      - "8088:80"

volumes:
  db_data:
