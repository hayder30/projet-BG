<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Brazilian Glow – Stock</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>

  <!-- Login -->
  <main id="login-screen" class="login" hidden>
    <form id="login-form" class="login-card">
      <h1 class="brand-title">Brazilian Glow</h1>
      <p class="muted">Stock management</p>
      <label>Username
        <input name="username" autocomplete="username" required autofocus>
      </label>
      <label>Password
        <input name="password" type="password" autocomplete="current-password" required>
      </label>
      <p id="login-error" class="error" role="alert"></p>
      <button class="btn primary" type="submit">Sign in</button>
    </form>
  </main>

  <!-- App -->
  <div id="app" class="shell" hidden>
    <aside class="sidebar">
      <div class="brand">
        <span class="brand-title">Brazilian Glow</span>
        <span class="brand-sub">Stock</span>
      </div>
      <nav id="nav">
        <button data-view="dashboard">Dashboard</button>
        <button data-view="products">Products</button>
        <button data-view="movements">Stock movements</button>
        <button data-view="settings" data-admin>Settings</button>
      </nav>
      <div class="sidebar-foot">
        <span id="whoami"></span>
        <button id="logout" class="link">Sign out</button>
      </div>
    </aside>
    <main id="view" class="content"></main>
  </div>

  <dialog id="dlg">
    <form method="dialog" id="dlg-form">
      <h2 id="dlg-title"></h2>
      <div id="dlg-body"></div>
      <p id="dlg-error" class="error" role="alert"></p>
      <div class="dlg-actions">
        <button type="button" class="btn" id="dlg-cancel">Cancel</button>
        <button type="submit" class="btn primary" id="dlg-ok">Save</button>
      </div>
    </form>
  </dialog>

  <div id="toast" role="status" aria-live="polite"></div>

  <script src="config.js"></script>
  <script src="app.js"></script>
</body>
</html>
